<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>結帳｜早安廚房</title><link rel="stylesheet" href="assets/style.css"></head><body><div id="header"></div><main><section class="wrap page"><h1 class="page-title">確認訂單</h1><p class="sub">選擇內用或外帶，確認聯絡資料與付款方式。</p><div class="layout"><div><div class="panel"><h3>用餐資訊</h3><div class="choices"><label class="choice"><input type="radio" name="mode" value="dinein" checked><span><strong>🍽️ 內用</strong><small>在店內享用</small></span></label><label class="choice"><input type="radio" name="mode" value="takeaway"><span><strong>🥡 外帶</strong><small>選擇預計取餐時間</small></span></label></div><div class="field"><label>桌號（內用）</label><select id="table"><option value="">請選擇桌號</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select></div><h4>服務方式（內用）</h4><div class="choices"><label class="choice"><input type="radio" name="service" value="table" checked><span><strong>桌邊服務</strong><small>僅限線上付款</small></span></label><label class="choice"><input type="radio" name="service" value="counter"><span><strong>櫃台取餐</strong><small>可線上付款或現金</small></span></label></div><div class="formgrid"><div class="field"><label>預計取餐日期（外帶）</label><input id="date" type="date"></div><div class="field"><label>預計取餐時間（外帶）</label><select id="time"><option value="">選擇時間</option><option>08:00</option><option>08:15</option><option>08:30</option><option>08:45</option><option>09:00</option><option>09:15</option><option>09:30</option><option>09:45</option><option>10:00</option><option>10:15</option><option>10:30</option><option>10:45</option><option>11:00</option><option>11:15</option><option>11:30</option><option>11:45</option><option>12:00</option></select></div></div></div><div class="panel"><h3>聯絡資料</h3><div class="formgrid"><div class="field"><label>稱呼</label><input id="name" placeholder="王小姐"></div><div class="field"><label>聯絡電話</label><input id="phone" placeholder="0912345678"></div></div></div><div class="panel"><h3>付款方式</h3><div class="choices"><label class="choice"><input type="radio" name="payment" value="card" checked><span><strong>💳 信用卡</strong></span></label><label class="choice"><input type="radio" name="payment" value="linepay"><span><strong>💚 LINE Pay</strong></span></label><label class="choice"><input type="radio" name="payment" value="easycard"><span><strong>悠遊付</strong></span></label><label class="choice"><input type="radio" name="payment" value="cash"><span><strong>💵 現金</strong><small>外帶或內用櫃台取餐可使用；桌邊服務不可使用</small></span></label></div><div class="notice">桌邊服務僅限線上付款；外帶取餐時間只適用於外帶。</div></div></div><aside class="panel"><h3>訂單摘要</h3><p class="sub">金額會依購物車與優惠券計算。</p><div class="line"><span>商品小計</span><strong id="subtotal">$0</strong></div><div class="line"><span>優惠折抵</span><strong id="discount">-$0</strong></div><div class="line total"><span>應付金額</span><span id="total">$0</span></div><button class="btn primary" style="width:100%" onclick="orderSubmit()">確認送出訂單</button><a class="btn light" style="width:100%;margin-top:9px" href="cart.html">返回購物車</a><p class="muted">付款為前端模擬，不會真的扣款。</p></aside></div></section></main><div id="footer"></div><div id="toast" class="toast" role="status"></div><script src="assets/app.js"></script></body></html>
