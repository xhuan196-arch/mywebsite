<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>查詢訂單｜早安廚房</title>
    <link rel="stylesheet" href="assets/style.css">
  </head>
  <body>
    <div id="header">
    </div>
    <main>
      <section class="wrap page">
        <h1 class="page-title">查詢訂單</h1>
        <p class="sub">輸入目前瀏覽器中建立的訂單編號。</p>
        <div class="panel">
          <div class="tools">
            <input class="search" id="order-id" placeholder="訂單編號 AM…">
            <button class="btn primary" onclick="lookup()">查詢</button>
          </div>
          <p id="lookup-message" class="muted">
          </p>
        </div>
        <div class="panel">
          <h3>查詢方式</h3>
          <p class="sub">完成點餐後，可在訂單結果頁看到編號。本示範版使用 sessionStorage，關閉分頁後不保證保留。</p>
          <a class="btn light" href="order.html">查看本次訂單</a>
        </div>
      </section>
    </main>
    <div id="footer">
    </div>
    <div id="toast" class="toast" role="status">
    </div>
    <script src="assets/app.js">
    </script>
  </body>
</html>
